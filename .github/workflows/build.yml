name: Build

on:
  push:
    branches:
      - 10.x
  pull_request:
    branches:
      - 10.x

permissions:
  contents: read

jobs:
  build:
    name: PHP ${{ matrix.php }} - ${{ matrix.os }} - ${{ matrix.dependencies }}

    strategy:
      fail-fast: false

      matrix:
        php:
          - "8.1"
          - "8.2"
          - "8.3"
        dependencies:
          - lowest
          - highest
        os:
          - pharaonic-linux-runner
          - pharaonic-windows-runner

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Check style
        if: matrix.os == 'pharaonic-linux-runner' && matrix.php == '8.1' && matrix.dependencies == 'highest'
        run: composer style

      - name: Static analysis
        if: matrix.os == 'pharaonic-linux-runner' && matrix.php == '8.1' && matrix.dependencies == 'highest'
        run: composer analyse

      - name: Run tests
        run: composer test
